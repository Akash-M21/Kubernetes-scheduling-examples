apiVersion: apps/v1
kind: Deployment

metadata:
  name: gpu-app-node-selector
  namespace: default

spec:
  replicas: 2

  selector:
    matchLabels:
      app: gpu-app-node-selector

  template:
    metadata:
      labels:
        app: gpu-app-node-selector

    spec:
      nodeSelector:
        gpu: "true"

      containers:
      - name: cuda-container
        image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda10.2
